<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تعلم العربية - حرفي</title>
<meta name="description" content="تعلم الحروف والكلمات والجمل العربية بالنطق الصوتي التفاعلي." />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="nav-root"></div>
<div class="max-w-6xl mx-auto px-4 pt-4 flex items-center justify-between">
  <h1 class="text-xl md:text-2xl font-bold text-gray-800">تعلم العربية</h1>
  <div id="score" class="text-sm md:text-base font-bold text-gray-700">🎯 نقاطك: 0</div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-target="tab-letters">الحروف</button>
    <button class="tab" data-target="tab-words">الكلمات</button>
    <button class="tab" data-target="tab-sentences">الجمل</button>
    <button class="tab" data-target="tab-tashkeel">✏️ التشكيل</button>
    <button class="tab" data-target="tab-songs">🎵 أغاني الحروف</button>

  </div>

  <div id="tab-letters" class="tab-content active">
    <div id="letters-grid" class="letters-grid"></div>
  </div>

  <div id="tab-words" class="tab-content">
    <div id="words-container"></div>
  </div>

  <div id="tab-sentences" class="tab-content">
    <div id="sentences-container"></div>
  </div>

  <div id="tab-songs" class="tab-content">
  <div id="tab-tashkeel" class="tab-content">
    <p class="text-center text-gray-700 mb-3">اختر حرفاً ثم اضغط على أي حركة لسماع نطقها 🔊</p>
    <div id="tashkeel-letters" class="tk-picker"></div>
    <h3 id="tashkeel-title" class="text-center font-bold text-lg my-4"></h3>
    <div id="tashkeel-forms" class="tk-grid"></div>
  </div>

  <div id="tab-songs" class="tab-content">
    <p class="text-center text-gray-700 mb-4">اضغط على أي بطاقة لسماع النشيد 🎧</p>

    <div id="songs-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
  </div>
</div>

<div id="footer-root"></div>
<script src="/js/layout.js"></script>

<script src="/js/speech.js"></script>
<script src="/js/app.js"></script>
<script src="/js/songs.js"></script>
</body>
</html>
