<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>العب وتعلم - حرفي</title>
<meta name="description" content="لعبة تفاعلية: طابق الحرف الأول مع الكلمة، واجمع النقاط!" />
<meta property="og:title" content="العب وتعلم - حرفي" />
<meta property="og:description" content="لعبة الحروف التفاعلية بالنطق الصوتي." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<style>body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#FFF8E1 0%,#FFE0E0 100%);min-height:100vh}</style>
</head>
<body>
<div id="nav-root"></div>

<section class="max-w-3xl mx-auto px-4 pt-8 text-center">
  <div class="text-6xl mb-2">🎮</div>
  <h1 class="text-3xl md:text-4xl font-black text-gray-800 mb-2">العب وتعلم</h1>
  <p class="text-gray-600 mb-6">استمع للكلمة، واختر الحرف الأول ✨</p>

  <div class="grid grid-cols-3 gap-3 max-w-md mx-auto mb-6">
    <div class="bg-white rounded-2xl p-4 shadow"><div class="text-xs text-gray-500">النقاط</div><div id="score" class="text-3xl font-black text-[#FF6B6B]">0</div></div>
    <div class="bg-white rounded-2xl p-4 shadow"><div class="text-xs text-gray-500">السلسلة</div><div id="streak" class="text-3xl font-black text-[#FFD93D]">0</div></div>
    <div class="bg-white rounded-2xl p-4 shadow"><div class="text-xs text-gray-500">أفضل نتيجة</div><div id="best" class="text-3xl font-black text-[#4ECDC4]">0</div></div>
  </div>
</section>

<main class="max-w-3xl mx-auto px-4 pb-12">
  <div id="game" class="bg-white/70 backdrop-blur rounded-3xl p-6 md:p-8 shadow-xl"></div>
  <div class="text-center mt-6">
    <button onclick="reset()" class="bg-gray-800 hover:bg-gray-900 text-white px-6 py-3 rounded-full font-bold">🔄 إعادة البدء</button>
  </div>
</main>

<div id="footer-root"></div>
<script src="/js/layout.js"></script>
<script>window.HARFI_LANG='ar';</script>
<script src="/js/speech.js"></script>
<script src="/js/play.js"></script>
