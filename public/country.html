<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>صفحة الدولة - حرفي</title>
<meta name="description" content="تعرف على دولة عربية بالتفصيل: العلم، العاصمة، السكان، العملة، اللغة، المعالم، وأكثر." />
<meta property="og:title" content="صفحة الدولة - حرفي" />
<meta property="og:description" content="معلومات تفصيلية عن الدولة العربية للأطفال." />
<meta property="og:type" content="article" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { font-family:'Tajawal',sans-serif; background:#F8FAFC; min-height:100vh; }
  .country-hero { color:#fff; padding:60px 16px 100px; text-align:center; position:relative; overflow:hidden; }
  .country-hero::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.18), transparent 45%); }
  .hero-flag { font-size:120px; display:flex; justify-content:center; line-height:1; margin-bottom:8px; filter:drop-shadow(0 8px 24px rgba(0,0,0,.25)); position:relative; }
  .hero-name { font-size:clamp(30px,5vw,48px); font-weight:900; margin-bottom:8px; position:relative; }
  .hero-capital { font-size:18px; opacity:.95; position:relative; }
  .hero-actions { margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; position:relative; }
  .hero-btn { background:rgba(255,255,255,.2); backdrop-filter:blur(8px); color:#fff; border:2px solid rgba(255,255,255,.4); padding:12px 22px; border-radius:999px; font-weight:700; font-family:inherit; cursor:pointer; min-height:44px; transition:.2s; display:inline-flex; align-items:center; gap:8px; }
  .hero-btn:hover { background:rgba(255,255,255,.35); }
  .hero-btn.primary { background:#fff; color:#2D3436; }

  .content-wrap { max-width:960px; margin:-60px auto 0; padding:0 16px 60px; position:relative; z-index:2; }
  .info-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:24px; }
  .info-card { background:#fff; border-radius:18px; padding:18px; box-shadow:0 4px 20px rgba(0,0,0,.06); text-align:center; }
  .info-card .ic { width:44px; height:44px; border-radius:12px; background:#E8F9F7; color:#4ECDC4; display:flex; align-items:center; justify-content:center; font-size:20px; margin:0 auto 10px; }
  .info-card .k { font-size:13px; color:#636e72; font-weight:700; }
  .info-card .v { font-size:17px; font-weight:900; color:#2D3436; margin-top:4px; }

  .section-card { background:#fff; border-radius:22px; padding:22px; box-shadow:0 4px 20px rgba(0,0,0,.06); margin-bottom:18px; }
  .section-title { font-size:22px; font-weight:900; color:#2D3436; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .greeting-row { display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,#FFF3E0 0%,#FFE0B2 100%); padding:18px; border-radius:16px; }
  .greeting-text { flex:1; font-size:24px; font-weight:900; color:#2D3436; }
  .speak-round { background:#4ECDC4; color:#fff; border:none; width:52px; height:52px; border-radius:50%; font-size:20px; cursor:pointer; box-shadow:0 6px 18px rgba(78,205,196,.35); transition:.2s; flex-shrink:0; }
  .speak-round:hover { transform:scale(1.08); }
  .fact-box { background:linear-gradient(135deg,#E8F9F7 0%,#D0F0EC 100%); border-right:5px solid #4ECDC4; padding:18px; border-radius:14px; font-size:17px; line-height:1.8; color:#2D3436; }
  .landmarks { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .landmark { background:#F8F9FA; padding:16px; border-radius:14px; text-align:center; font-weight:700; color:#495057; transition:.2s; cursor:pointer; border:2px solid transparent; }
  .landmark:hover { background:#fff; border-color:#4ECDC4; transform:translateY(-3px); }
  .landmark .pin { font-size:26px; margin-bottom:6px; }

  .anthem-box { background:linear-gradient(135deg,#FFF8E1 0%,#FFECB3 100%); border:2px solid #FFD54F; border-radius:18px; padding:20px; }
  .anthem-title { font-size:22px; font-weight:900; color:#5D4037; display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .anthem-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
  .anthem-meta .m { background:rgba(255,255,255,.7); padding:10px 12px; border-radius:12px; font-size:13px; color:#5D4037; }
  .anthem-meta .m b { display:block; color:#8D6E63; font-size:11px; font-weight:800; margin-bottom:2px; }
  .anthem-lyrics { background:rgba(255,255,255,.85); padding:18px; border-radius:14px; font-size:17px; line-height:2.2; color:#3E2723; font-weight:600; text-align:center; margin-bottom:12px; white-space:pre-line; }
  .anthem-note { font-size:13px; color:#795548; font-style:italic; background:rgba(255,255,255,.5); padding:10px 14px; border-radius:10px; border-right:3px solid #FFB300; }
  .anthem-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .anthem-btn { background:#FF9800; color:#fff; border:none; padding:10px 18px; border-radius:999px; font-family:inherit; font-weight:700; cursor:pointer; min-height:44px; display:inline-flex; align-items:center; gap:8px; box-shadow:0 4px 14px rgba(255,152,0,.35); transition:.2s; }
  .anthem-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(255,152,0,.45); }
  .anthem-btn.stop { background:#E53935; box-shadow:0 4px 14px rgba(229,57,53,.35); }

  .related { margin-top:26px; }
  .related-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .related a { background:#fff; padding:14px; border-radius:16px; text-align:center; text-decoration:none; color:#2D3436; box-shadow:0 4px 14px rgba(0,0,0,.05); transition:.2s; }
  .related a:hover { transform:translateY(-4px); box-shadow:0 10px 24px rgba(0,0,0,.1); }
  .related .rf { font-size:40px; }
  .related .rn { font-size:14px; font-weight:800; margin-top:6px; }

    /* Extra sections */
  .brief-box { background:linear-gradient(135deg,#EEF2FF 0%,#E0E7FF 100%); border-right:5px solid #6366F1; padding:18px; border-radius:14px; font-size:17px; line-height:2; color:#312E81; }
  .cities { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .city { background:#F1F8FF; border:2px solid transparent; padding:14px; border-radius:14px; text-align:center; font-weight:800; color:#0B4F6C; cursor:pointer; transition:.2s; }
  .city.capital-city { background:linear-gradient(135deg,#FFF3E0,#FFE0B2); color:#8D4E00; }
  .city:hover { border-color:#4ECDC4; transform:translateY(-3px); }
  .city .ci { display:block; font-size:22px; margin-bottom:4px; }
  .rulers { display:flex; flex-direction:column; gap:10px; }
  .ruler { display:flex; align-items:center; gap:14px; background:#FAFAFA; border-radius:14px; padding:14px; border-right:4px solid #B0BEC5; }
  .ruler.current { background:linear-gradient(135deg,#E8F5E9,#C8E6C9); border-right-color:#43A047; }
  .ruler .rav { width:44px; height:44px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .ruler .rname { font-weight:900; color:#2D3436; font-size:16px; }
  .ruler .rmeta { font-size:13px; color:#607D8B; font-weight:700; margin-top:2px; }
  .ruler .rperiod { margin-inline-start:auto; font-size:13px; font-weight:800; color:#455A64; background:#fff; padding:6px 12px; border-radius:999px; white-space:nowrap; }
  .anthem-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .anthem-tab { border:2px solid #FFB300; background:#fff; color:#B26A00; font-family:inherit; font-weight:800; padding:10px 18px; border-radius:999px; cursor:pointer; min-height:44px; }
  .anthem-tab.active { background:#FF9800; color:#fff; border-color:#FF9800; }
  .anthem-audio { width:100%; margin-top:10px; }
  .anthem-status { font-size:13px; color:#795548; margin-top:8px; font-weight:700; }

  .back-link { display:inline-flex; align-items:center; gap:8px; color:#4ECDC4; font-weight:700; text-decoration:none; margin-bottom:16px; }
  .back-link:hover { color:#3DBDB4; }
</style>
</head>
<body>

<div id="nav-root"></div>

<section id="hero" class="country-hero" style="background:linear-gradient(135deg,#4ECDC4 0%,#556270 100%)">
  <div id="h-flag" class="hero-flag"></div>
  <h1 id="h-name" class="hero-name"></h1>
  <p id="h-capital" class="hero-capital"></p>
  <div class="hero-actions">
    <button class="hero-btn primary" onclick="speakName()"><i class="fa-solid fa-volume-high"></i><span>استمع للاسم</span></button>
    <button class="hero-btn" onclick="speakGreeting()"><i class="fa-solid fa-hand-wave"></i><span>استمع للتحية</span></button>
  </div>
</section>

<div class="content-wrap">
  <a href="/countries.html" class="back-link"><i class="fa-solid fa-arrow-right"></i> عودة للدول</a>

  <div class="info-grid">
    <div class="info-card"><div class="ic"><i class="fa-solid fa-city"></i></div><div class="k">العاصمة</div><div class="v" id="i-capital"></div></div>
    <div class="info-card"><div class="ic"><i class="fa-solid fa-users"></i></div><div class="k">عدد السكان</div><div class="v" id="i-pop"></div></div>
    <div class="info-card"><div class="ic"><i class="fa-solid fa-coins"></i></div><div class="k">العملة</div><div class="v" id="i-cur"></div></div>
    <div class="info-card"><div class="ic"><i class="fa-solid fa-language"></i></div><div class="k">اللغة</div><div class="v" id="i-lang"></div></div>
    <div class="info-card"><div class="ic"><i class="fa-solid fa-ruler-combined"></i></div><div class="k">المساحة</div><div class="v" id="i-area"></div></div>
    <div class="info-card"><div class="ic"><i class="fa-solid fa-earth-africa"></i></div><div class="k">القارة</div><div class="v" id="i-cont"></div></div>
  </div>

  <div class="section-card">
    <div class="section-title">👋 التحية المحلية</div>
    <div class="greeting-row">
      <div id="i-greet" class="greeting-text"></div>
      <button class="speak-round" onclick="speakGreeting()"><i class="fa-solid fa-volume-high"></i></button>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title">💡 معلومة ممتعة</div>
    <div class="fact-box" id="i-fact"></div>
    <div class="text-left mt-3"><button class="speak-round" onclick="speakFact()"><i class="fa-solid fa-volume-high"></i></button></div>
  </div>

  <div class="section-card">
    <div class="section-title">🏛️ أشهر المعالم</div>
    <div id="i-landmarks" class="landmarks"></div>
  </div>

  <div class="section-card" id="brief-section" style="display:none">
    <div class="section-title">📘 نبذة مختصرة</div>
    <div class="brief-box" id="i-brief"></div>
    <div class="text-left mt-3"><button class="speak-round" onclick="speakBrief()"><i class="fa-solid fa-volume-high"></i></button></div>
  </div>

  <div class="section-card" id="cities-section" style="display:none">
    <div class="section-title">🏙️ المدن الرئيسية</div>
    <div id="i-cities" class="cities"></div>
  </div>

  <div class="section-card" id="rulers-section" style="display:none">
    <div class="section-title">👑 الحكّام وفترات الحكم</div>
    <div id="i-rulers" class="rulers"></div>
  </div>

  <div class="section-card" id="anthem-section" style="display:none">
    <div class="anthem-box">
      <div class="anthem-title">🎵 النشيد الوطني: <span id="a-title"></span></div>
      <div class="anthem-meta">
        <div class="m"><b>الشاعر</b><span id="a-poet"></span></div>
        <div class="m"><b>الملحن</b><span id="a-comp"></span></div>
        <div class="m"><b>سنة الاعتماد</b><span id="a-year"></span></div>
      </div>
      <div class="anthem-lyrics" id="a-lyrics"></div>
      <div class="anthem-note" id="a-note"></div>
      <div class="anthem-tabs">
        <button class="anthem-tab active" id="tab-melody" onclick="anthemMode('melody')">🎼 مع اللحن</button>
        <button class="anthem-tab" id="tab-voice" onclick="anthemMode('voice')">🗣️ بدون لحن (قراءة)</button>
      </div>
      <div id="melody-pane">
        <audio id="anthem-audio" class="anthem-audio" controls preload="none"></audio>
        <div class="anthem-status" id="anthem-status">⏳ جارٍ تجهيز التسجيل الموسيقي…</div>
      </div>
      <div id="voice-pane" style="display:none">
        <div class="anthem-actions">
          <button class="anthem-btn" onclick="playAnthem()"><i class="fa-solid fa-play"></i> استمع للنص</button>
          <button class="anthem-btn stop" onclick="stopAnthem()"><i class="fa-solid fa-stop"></i> إيقاف</button>
        </div>
      </div>
    </div>
  </div>

  <div class="related">
    <div class="section-title">🌟 اكتشف دولاً أخرى</div>
    <div id="related-grid" class="related-grid"></div>
  </div>
</div>

<div id="footer-root"></div>
<script src="/js/layout.js"></script>
<script>window.HARFI_LANG='ar';</script>
<script src="/js/speech.js"></script>
<script src="/js/countries.js"></script>
<script src="/js/anthems.js"></script>
<script src="/js/country-extra.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'sa';
  const c = (window.COUNTRIES||[]).find(x=>x.id===id) || window.COUNTRIES[0];

  document.title = `${c.name} - حرفي`;
  document.getElementById('hero').style.background = `linear-gradient(135deg, ${c.color} 0%, #2D3436 100%)`;
  document.getElementById('h-flag').innerHTML = (typeof flagImg==='function') ? flagImg(c, 200) : c.flag;
  document.getElementById('h-name').textContent = c.name;
  document.getElementById('h-capital').innerHTML = `<i class="fa-solid fa-location-dot"></i> العاصمة: ${c.capital}`;
  document.getElementById('i-capital').textContent = c.capital;
  document.getElementById('i-pop').textContent = c.population;
  document.getElementById('i-cur').textContent = c.currency;
  document.getElementById('i-lang').textContent = c.language;
  document.getElementById('i-area').textContent = c.area;
  document.getElementById('i-cont').textContent = c.continent;
  document.getElementById('i-greet').textContent = c.greeting;
  document.getElementById('i-fact').textContent = c.fact;
  document.getElementById('i-landmarks').innerHTML = c.landmarks.map(l=>`
    <div class="landmark" onclick="speakText('${l.replace(/'/g,"\\'")}')">
      <div class="pin">📍</div><div>${l}</div>
    </div>
  `).join('');

  // النشيد الوطني
  const anthem = (window.ANTHEMS||{})[c.id];
  if(anthem){
    document.getElementById('anthem-section').style.display='block';
    document.getElementById('a-title').textContent = anthem.title;
    document.getElementById('a-poet').textContent = anthem.poet;
    document.getElementById('a-comp').textContent = anthem.composer;
    document.getElementById('a-year').textContent = anthem.year;
    document.getElementById('a-lyrics').textContent = anthem.lyrics.join('\n');
    document.getElementById('a-note').textContent = '📝 ' + anthem.note;
  }

  const related = window.COUNTRIES.filter(x=>x.continent===c.continent && x.id!==c.id).slice(0,6);
  document.getElementById('related-grid').innerHTML = related.map(r=>`
    <a href="/country.html?id=${r.id}"><div class="rf">${typeof flagImg==='function'?flagImg(r,90):r.flag}</div><div class="rn">${r.name}</div></a>
  `).join('');

  function speakText(t){ if(typeof speak==='function') speak(t,1.0,'ar-SA'); }
  function speakName(){ speakText(c.name); }
  function speakGreeting(){ speakText(c.greeting); }
  function speakFact(){ speakText(c.fact); }
  function speakBrief(){ const x=(window.COUNTRY_EXTRA||{})[c.id]; if(x) speakText(x.brief); }

  // البيانات الإثرائية
  const extra = (window.COUNTRY_EXTRA||{})[c.id];
  if(extra){
    document.getElementById('brief-section').style.display='block';
    document.getElementById('i-brief').textContent = extra.brief;

    document.getElementById('cities-section').style.display='block';
    document.getElementById('i-cities').innerHTML = extra.cities.map(city=>`
      <div class="city ${city===c.capital?'capital-city':''}" onclick="speakText('${city.replace(/'/g,"\\'")}')">
        <span class="ci">${city===c.capital?'⭐':'🏙️'}</span>${city}${city===c.capital?' <small>(العاصمة)</small>':''}
      </div>`).join('');

    document.getElementById('rulers-section').style.display='block';
    document.getElementById('i-rulers').innerHTML = extra.rulers.map((r,i)=>`
      <div class="ruler ${i===0?'current':''}">
        <div class="rav">${i===0?'👑':'🕰️'}</div>
        <div><div class="rname">${r.name}</div><div class="rmeta">${r.title}</div></div>
        <div class="rperiod">${r.period}</div>
      </div>`).join('');
  }

  // وضع عرض النشيد
  function anthemMode(m){
    const mel = m==='melody';
    document.getElementById('melody-pane').style.display = mel?'block':'none';
    document.getElementById('voice-pane').style.display = mel?'none':'block';
    document.getElementById('tab-melody').classList.toggle('active', mel);
    document.getElementById('tab-voice').classList.toggle('active', !mel);
    if(mel) stopAnthem(); else { const a=document.getElementById('anthem-audio'); if(a) a.pause(); }
  }

  if(anthem && typeof window.fetchAnthemAudio==='function'){
    window.fetchAnthemAudio(c.id).then(src=>{
      const audio=document.getElementById('anthem-audio');
      const st=document.getElementById('anthem-status');
      if(src){ audio.src=src; st.textContent='🎼 تسجيل رسمي للنشيد باللحن — اضغط تشغيل.'; }
      else { audio.style.display='none'; st.textContent='🎧 التسجيل الموسيقي غير متاح حالياً، يمكنك الاستماع للنص من تبويب "بدون لحن".'; }
    });
  }
  function playAnthem(){
    if(!anthem) return;
    stopAnthem();
    const text = anthem.title + '. ' + anthem.lyrics.join('. ');
    if(typeof speak==='function') speak(text, 0.85, 'ar-SA');
  }
  function stopAnthem(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); }
</script>
</body>
</html>
